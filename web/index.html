<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpareParts Framework Selection</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f6f8fa; /* GitHub-like background */
            color: #24292f; /* GitHub text color */
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #0366d6; /* GitHub primary color */
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            border: 1px solid #0366d6;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-primary {
            background-color: #0366d6;
            color: white;
        }
        .btn-secondary {
            background-color: #ffffff;
            color: #0366d6;
        }
        .btn-primary:hover {
            background-color: #005cc5;
        }
        .btn-secondary:hover {
            background-color: #f1f8ff;
            border-color: #005cc5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to SpareParts Framework</h1>
        <p>Please select the version of the framework you wish to use:</p>

        <div class="buttons-container">
            <a href="https://github.com/NaimK177/SpareParts-Framework" class="btn btn-primary">
                ⚙️ Python Version with DQN and PPO
            </a>

            <a href="https://github.com/NaimK177/DCL-Spare-Parts" class="btn btn-secondary">
                🚀 C++ version with DCL
            </a>
        </div>
        <p style="margin-top: 30px; font-size: 0.9em; color: #586069;">
            Note: All official documentation and development continues on the selected branch.
        </p>
    </div>
</body>
</html>
